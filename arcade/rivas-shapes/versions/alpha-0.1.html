<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111632"><title>Riva's Shapes • Alpha 0.1</title>
<style>
:root{color-scheme:dark;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#111632;color:white;touch-action:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#hud{pointer-events:none;position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 22px 0;gap:12px}.brand{font-size:clamp(16px,3.2vw,26px);font-weight:900;text-shadow:0 3px #06091b}.brand span{color:#ffdd76}.sub{color:#bfc8ff;font-size:11px;letter-spacing:.15em;text-transform:uppercase}.score{border:3px solid #6374be;background:#1a2350e8;border-radius:18px;box-shadow:0 6px #080c22;padding:8px 18px;min-width:95px;text-align:center}.score small{display:block;font-size:10px;letter-spacing:.16em;color:#aab9fb}.score strong{display:block;font-size:clamp(26px,5vw,38px);font-variant-numeric:tabular-nums}#controls{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;right:18px;display:flex;gap:9px;align-items:end;justify-content:space-between;pointer-events:none}.controls-left,.controls-right{display:flex;gap:9px;pointer-events:auto}button{appearance:none;border:2px solid #5367ae;border-radius:15px;padding:11px 14px;background:#202d65ed;color:white;font:800 13px ui-rounded,"Trebuchet MS",sans-serif;box-shadow:0 4px #090d2c;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px #090d2c}button:focus-visible{outline:3px solid #fbd77b;outline-offset:3px}#overlay{position:fixed;inset:0;background:#0c1233d6;display:flex;align-items:center;justify-content:center;padding:25px;z-index:3}#overlay.hidden{display:none}.panel{border:3px solid #7685d1;background:#1d285c;box-shadow:0 12px #080e2e;border-radius:27px;padding:clamp(24px,5vw,46px);max-width:470px;text-align:center}.panel .big{font-size:clamp(38px,8vw,65px)}.panel h1{margin:0;color:#ffdf7d;font-size:clamp(27px,6vw,42px)}.panel p{color:#d6dcff;font-size:17px;line-height:1.45}.panel button{font-size:20px;padding:15px 38px;background:#ef63a3;border-color:#ffb6dc;margin-top:8px}.panel small{display:block;margin-top:23px;color:#aebbe9;font-size:12px}@media(max-width:460px){#hud{padding-left:12px;padding-right:12px}.brand{font-size:17px}.sub{font-size:9px}.score{padding:6px 10px;min-width:75px}#controls{left:9px;right:9px;bottom:calc(10px + env(safe-area-inset-bottom))}button{padding:11px 10px;font-size:12px}}
</style></head><body>
<canvas id="game" aria-label="Colourful moving shapes game. Tap shapes to score points."></canvas>
<div id="hud"><div><div class="brand">★ <span>RIVA'S</span> SHAPES</div><div class="sub">Alpha 0.1 · tiny arcade</div></div><div class="score" aria-live="off"><small>STARS</small><strong id="score">0</strong></div></div>
<div id="controls"><div class="controls-left"><button id="pause">Ⅱ Pause</button><button id="reset">↻ Restart</button></div><div class="controls-right"><button id="speed">☁ Gentle</button><button id="sound">♪ Sound off</button><button id="full" aria-label="Fullscreen">⛶</button></div></div>
<div id="overlay"><div class="panel"><div class="big">🔴 🟨 🔷</div><h1>Riva's Shapes!</h1><p>Touch the colourful shapes.<br>Pop, sparkle, and collect stars!</p><button id="start">▶ Let's play!</button><small>Gentle movement · No flashing · No timers · Made for little hands<br>Best enjoyed together with a grown-up</small></div></div>
<script>
(()=>{'use strict';const cvs=document.getElementById('game'),ctx=cvs.getContext('2d',{alpha:false}),scoreEl=document.getElementById('score'),btn=id=>document.getElementById(id),colors=['#ff6989','#ffd36c','#63ddc8','#79b9ff','#c69bff','#ff9b61'];let w=0,h=0,dpr=1,shapes=[],particles=[],score=0,running=false,paused=false,gentle=true,sound=false,last=0,spawnClock=0,ambient=[],audio=null;const rnd=(a,b)=>a+Math.random()*(b-a),usable=()=>({top:Math.max(112,h*.13),bottom:Math.max(94,h*.13),left:22,right:22});
function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cvs.width=Math.round(w*dpr);cvs.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ambient=Array.from({length:35},()=>({x:Math.random()*w,y:Math.random()*h,r:rnd(.7,2),a:rnd(.1,.35)}));for(const s of shapes){s.x=Math.max(s.r,Math.min(w-s.r,s.x));s.y=Math.max(usable().top+s.r,Math.min(h-usable().bottom-s.r,s.y))}}addEventListener('resize',size);size();
function makeShape(){const m=usable(),r=Math.min(rnd(40,66),Math.max(29,w*.115)),left=r+m.left,right=Math.max(left,w-r-m.right),top=m.top+r,bottom=Math.max(top,h-m.bottom-r),edge=Math.floor(Math.random()*4);let x=edge<2?(edge===0?left:right):rnd(left,right),y=edge>=2?(edge===2?top:bottom):rnd(top,bottom),vx=rnd(13,28)*(Math.random()<.5?-1:1),vy=rnd(11,25)*(Math.random()<.5?-1:1);return{x,y,vx,vy,r,kind:Math.floor(Math.random()*5),color:colors[Math.floor(Math.random()*colors.length)],phase:rnd(0,7),rot:rnd(0,6.28),spin:rnd(-.12,.12)}}
function fill(){while(shapes.length<Math.min(6,Math.max(3,Math.floor(w*h/95000)))){let s=makeShape();for(let tries=0;tries<18&&shapes.some(o=>Math.hypot(o.x-s.x,o.y-s.y)<o.r+s.r+12);tries++)s=makeShape();shapes.push(s)}}
function polygon(n,r){ctx.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function star(r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.48:r;i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath()}
function drawShape(s,t){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot+Math.sin(t*.0006+s.phase)*.10);let r=s.r*(1+.035*Math.sin(t*.0013+s.phase));ctx.shadowColor=s.color;ctx.shadowBlur=19;ctx.shadowOffsetY=5;ctx.fillStyle=s.color;ctx.strokeStyle='#fff8';ctx.lineWidth=3;if(s.kind===0){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2)}else if(s.kind===1){ctx.beginPath();ctx.roundRect(-r*.84,-r*.84,r*1.68,r*1.68,r*.17)}else if(s.kind===2)polygon(3,r*1.12);else if(s.kind===3)star(r*1.12);else polygon(6,r);ctx.fill();ctx.shadowBlur=0;ctx.stroke();ctx.beginPath();ctx.ellipse(-r*.27,-r*.31,r*.18,r*.11,-.55,0,Math.PI*2);ctx.fillStyle='#ffffff95';ctx.fill();ctx.restore()}
function burst(x,y,color){for(let i=0;i<15;i++){let a=i*Math.PI*2/15+rnd(-.17,.17),v=rnd(60,190);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.75),ttl:.75,r:rnd(3,9),color})}particles.push({x,y,vx:0,vy:-22,life:.8,ttl:.8,color,label:'★ +1'})}
function chirp(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(510,now);o.frequency.exponentialRampToValueAtTime(760,now+.12);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.075,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+.18);o.connect(g).connect(audio.destination);o.start(now);o.stop(now+.19)}catch{}}
function pop(x,y){if(!running||paused)return;let picked=-1,best=Infinity;for(let i=0;i<shapes.length;i++){const s=shapes[i],d=Math.hypot(x-s.x,y-s.y);if(d<s.r+Math.max(13,s.r*.24)&&d<best){picked=i;best=d}}if(picked>=0){const s=shapes.splice(picked,1)[0];score++;scoreEl.textContent=score;burst(s.x,s.y,s.color);chirp();spawnClock=.5}}
cvs.addEventListener('pointerdown',e=>{e.preventDefault();pop(e.clientX,e.clientY)},{passive:false});
function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/1000||0,.05);last=now;ctx.fillStyle='#111632';ctx.fillRect(0,0,w,h);ctx.fillStyle='#1b2450';for(let x=20;x<w;x+=44)for(let y=22;y<h;y+=44){ctx.beginPath();ctx.arc(x,y,1.15,0,7);ctx.fill()}for(let a of ambient){ctx.globalAlpha=a.a;ctx.fillStyle='#b7c9ff';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,7);ctx.fill()}ctx.globalAlpha=1;if(running&&!paused){const speed=gentle?1:1.65,m=usable();for(let s of shapes){s.x+=s.vx*dt*speed;s.y+=s.vy*dt*speed;s.rot+=s.spin*dt;const l=s.r+6,r=w-s.r-6,top=m.top+s.r,b=h-m.bottom-s.r;if(s.x<l){s.x=l;s.vx=Math.abs(s.vx)}if(s.x>r){s.x=r;s.vx=-Math.abs(s.vx)}if(s.y<top){s.y=top;s.vy=Math.abs(s.vy)}if(s.y>b){s.y=b;s.vy=-Math.abs(s.vy)}}spawnClock-=dt;if(spawnClock<=0){fill();spawnClock=.6}for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=65*dt}particles=particles.filter(p=>p.life>0)}for(let s of shapes)drawShape(s,now);for(let p of particles){ctx.save();ctx.globalAlpha=Math.min(1,p.life/p.ttl);if(p.label){ctx.fillStyle='#fff4b0';ctx.strokeStyle='#1c2452';ctx.lineWidth=5;ctx.font='900 29px Trebuchet MS,sans-serif';ctx.textAlign='center';ctx.strokeText(p.label,p.x,p.y);ctx.fillText(p.label,p.x,p.y)}else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.restore()}if(paused&&running){ctx.fillStyle='#090f29b0';ctx.fillRect(0,0,w,h);ctx.font='bold 36px Trebuchet MS';ctx.fillStyle='white';ctx.textAlign='center';ctx.fillText('PAUSED',w/2,h/2)}}requestAnimationFrame(tick);
function start(){score=0;scoreEl.textContent=0;shapes=[];particles=[];spawnClock=0;running=true;paused=false;btn('overlay').classList.add('hidden');btn('pause').textContent='Ⅱ Pause';fill()}btn('start').addEventListener('click',start);btn('reset').addEventListener('click',start);btn('pause').addEventListener('click',()=>{if(!running)return;paused=!paused;btn('pause').textContent=paused?'▶ Resume':'Ⅱ Pause'});btn('speed').addEventListener('click',()=>{gentle=!gentle;btn('speed').textContent=gentle?'☁ Gentle':'✦ Playful'});btn('sound').addEventListener('click',()=>{sound=!sound;btn('sound').textContent=sound?'♫ Sound on':'♪ Sound off'});btn('full').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.().catch(()=>{})});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;btn('pause').textContent='▶ Resume'}})
})();
</script></body></html>
