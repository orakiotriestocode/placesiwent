<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Inspectorate | Protected Locations Atlas</title><style>:root{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color-scheme:dark;background:#091923;color:#e7f3f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}main{width:min(440px,100%);padding:32px;border:1px solid #37625a;border-radius:16px;background:#142b32;box-shadow:0 20px 70px #020b1299}h1{font-size:21px;margin:0 0 9px}p{color:#abc5be;line-height:1.5;font-size:14px}form{display:grid;gap:12px;margin-top:24px}label{font-size:13px;color:#c2e2d8}input{background:#092029;color:#fff;border:1px solid #62877e;border-radius:9px;font:inherit;padding:14px;width:100%;font-size:17px}button{border:0;background:#238268;color:#fff;padding:13px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#msg{min-height:20px;color:#ffb9a8;font-size:13px}small{color:#9ab5ae;font-size:11px}a{color:#b5f1d7}</style></head><body><main><h1>Inspectorate Locations Atlas</h1><p style="color:#b5f1d7;font-weight:700">v7.6 · LIVE · PROTECTED</p><p>Enter your access code to open the Locations Atlas.</p><form id="unlock"><label for="code">Access code</label><input id="code" type="password" autocomplete="off" spellcheck="false" required autofocus><button id="go" type="submit">Unlock Atlas</button><div id="msg" role="status" aria-live="polite"></div></form><small>Edits remain in your browser until exported. Share the access code separately.</small><p><a href="/transformorate/">Back to Transformorate</a></p></main><script>
const ATLAS_SALT='gxq2rbvxvFhchzqGyJmylQ==';const ATLAS_BUNDLE={v:1,iv:'DWTGycePeMmXf0xr'};async function loadPayload(){const parts=await Promise.all(Array.from({length:15},(_,i)=>fetch('/inspector/atlas/payload/part-'+String(i).padStart(2,'0')+'.txt').then(r=>{if(!r.ok)throw Error('Payload unavailable');return r.text()})));return parts.join('')}
function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go'),msg=document.getElementById('msg');b.disabled=true;msg.textContent='Verifying access code…';try{const password=document.getElementById('code').value.trim().toUpperCase();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(ATLAS_SALT),iterations:450000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(ATLAS_BUNDLE.iv)},key,fromB64(await loadPayload()));const markup=new TextDecoder().decode(bytes);document.open();document.write(markup);document.close()}catch(err){msg.textContent='Invalid access code, or the encrypted document could not be opened.';b.disabled=false}});
</script></body></html>
