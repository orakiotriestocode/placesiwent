name: Park Builder browser tests
on:
  push:
    paths:
      - 'arcade/park-builder/**'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
      - '.github/workflows/park-builder-e2e.yml'
  pull_request:
    paths:
      - 'arcade/park-builder/**'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Serve site
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/park-server.log 2>&1 &
      - name: Run browser tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: park-builder-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
