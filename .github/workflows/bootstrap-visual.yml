name: Bootstrap visual baselines
on:
  push:
    branches: [quality-automation-ci]
    paths: ['tests/quality.spec.cjs', '.github/workflows/bootstrap-visual.yml']
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:visual:update
      - name: Save initial Linux visual baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/quality.spec.cjs-snapshots/*.png
          git commit -m 'Add initial Chromium visual baselines'
          git push
