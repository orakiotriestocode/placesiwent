name: Publish website (fast) + optional quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detailed browser, accessibility, visual and Lighthouse checks are useful,
  # but a hobby site should not wait for them on every main-branch release.
  quality:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --user 1001:1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Functional and accessibility tests
        run: npm test -- --grep-invert @visual
      - name: Visual regression report (informational)
        continue-on-error: true
        run: npm test -- --grep @visual --project chromium
      - name: Lighthouse performance budgets
        continue-on-error: true
        run: npm run test:performance
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: quality-reports
          path: |
            playwright-report/
            test-results/
            performance-report/
            .lighthouseci/
          retention-days: 7

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Release Quick To-Do v1.3
        if: ${{ hashFiles('scripts/release-todo-v13.py') != '' }}
        run: |
          python scripts/release-todo-v13.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-apps/downloads/quick-todo.zip web-apps/index.html
          git diff --cached --quiet || (git commit -m "Release Quick To-Do v1.3 [skip ci]" && git push)
      - name: Package static website
        run: npm run build
      - name: Quick release sanity checks
        run: |
          test -s _site/index.html
          test -s _site/web-apps/index.html
          test -s _site/web-apps/downloads/quick-todo.zip
          ! head -n 1 _site/index.html | grep -q '^---'
          ! head -n 1 _site/web-apps/index.html | grep -q '^---'
          grep -q 'href="/web-apps/downloads/quick-todo.zip"' _site/web-apps/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
