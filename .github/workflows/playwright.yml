name: Browser checks
on:
  push:
    branches: [main]
    paths: ['**/*.html', '**/*.js', '**/*.cjs', '**/*.css', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/playwright.yml']
  pull_request:
    branches: [main]
    paths: ['**/*.html', '**/*.js', '**/*.cjs', '**/*.css', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/playwright.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
