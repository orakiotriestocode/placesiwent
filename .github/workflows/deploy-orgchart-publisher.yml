name: Deploy orgchart publisher to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "inspector/publisher/worker.js"
      - "inspector/publisher/wrangler.jsonc"
      - ".github/workflows/deploy-orgchart-publisher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orgchart-publisher-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Cloudflare authorization configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Please add the CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi
      - name: Diagnose Cloudflare token scope (no secret output)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          verify=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$verify" | jq -c '{token_active:(.success and .result.status=="active"), errors:(.errors|map(.code))}'
          access=$(curl -sS -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/accounts/c06250734b831f1531ac484192bdb082/workers/services/orgchart-publisher)
          echo "$access" | jq -c '{worker_access:.success, errors:(.errors|map(.code))}'
          if [ "$(echo "$access" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare token cannot read the orgchart-publisher service. Verify the token account scope and Workers Scripts Edit permission."
            exit 1
          fi
      - name: Publish existing orgchart-publisher Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c06250734b831f1531ac484192bdb082
          workingDirectory: inspector/publisher
          command: deploy
      - name: Verify deployed endpoint
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 3 \
            https://orgchart-publisher.orakio.workers.dev/health
          echo
