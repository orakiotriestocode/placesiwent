function fromB64(s){const binary=atob(s);return Uint8Array.from(binary,c=>c.charCodeAt(0))}
function toB64(bytes){let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out)}
async function decipher(key,item){const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(item.iv)},key,fromB64(item.data));return new TextDecoder().decode(bytes)}
async function cipher(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const bytes=new TextEncoder().encode(JSON.stringify(obj));const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {v:1,iv:toB64(iv),data:toB64(new Uint8Array(encrypted))}}
document.getElementById('unlock').addEventListener('submit',async e=>{
 e.preventDefault();const b=document.getElementById('go'),msg=document.getElementById('msg');b.disabled=true;msg.textContent='Verifying access code…';
 try{
  const password=document.getElementById('code').value.trim().toUpperCase();
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(ATLAS_SALT),iterations:450000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  const markup=await decipher(key,ATLAS_BUNDLE);
  window.atlasSecure={decrypt:async envelope=>JSON.parse(await decipher(key,envelope)),encrypt:async document=>cipher(key,document)};
  document.open();document.write(markup);document.close();
 }catch(err){msg.textContent='Invalid access code, or the encrypted document could not be opened.';b.disabled=false;}
});
</script></body></html>
