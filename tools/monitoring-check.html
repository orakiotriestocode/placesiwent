<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitoring check · Places I Went</title>
<script src="https://browser.sentry-cdn.com/11.12.0/bundle.min.js" integrity="sha384-fpjRzLWxkdRneAxDGo5pt5gKsjCWYV5ksPD+S1lx80QHBhs6Oe58hf8sKUKubCES" crossorigin="anonymous"></script>
<script src="/assets/monitoring.js"></script>
<style>body{background:#0c131c;color:#eff3e7;font:18px system-ui;max-width:600px;margin:10vh auto;padding:24px}button{font:inherit;padding:12px;border-radius:8px;cursor:pointer}a{color:#81e2b3}</style></head><body><h1>Monitoring check</h1><p>This sends one clearly labelled test error to the Places I Went Sentry project.</p><button id="test">Send test error</button><p id="status" role="status"></p><a href="/">Back to home</a><script>
document.getElementById('test').onclick=async function(){
 const status=document.getElementById('status');
 if(!window.Sentry||!Sentry.getClient()){status.textContent='Monitoring is unavailable. Check whether a browser blocker prevented the SDK from loading.';return;}
 this.disabled=true;status.textContent='Sending test error…';
 const id=Sentry.captureException(new Error('PlacesIwent monitoring verification'),{tags:{monitoring_test:'true'}});
 const flushed=await Sentry.flush(10000);
 status.textContent=flushed?'Test submitted. Event ID: '+id:'Delivery timed out. Check Sentry before retrying.';
 this.disabled=false;
};
</script></body></html>
