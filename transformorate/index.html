<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Transformorate</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eff3e7;background:#0c131c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#193138 0,transparent 36rem),#0c131c}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid #81e2b3;outline-offset:5px}
.shell{width:min(1050px,100%);margin:0 auto;padding:16px 24px 16px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:12px;border-bottom:1px solid #30404a}
.brand{display:inline-flex;align-items:center;gap:12px;font-size:.91rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.brand-mark{width:36px;height:36px;border-radius:9px;background:#7fe0b3;color:#112822;display:grid;place-items:center;font-size:1.15rem}
header span.note{color:#91a9b0;font-size:.8rem}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:25px 0 32px}
h1{font-size:clamp(2.4rem,5vw,3.6rem);letter-spacing:-.065em;line-height:1.05;margin:0 0 8px}
.intro{color:#b5c6ca;line-height:1.6;font-size:1.06rem;margin:0 0 20px;max-width:630px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;min-height:160px;background:#15232e;border:1px solid #344955;border-radius:16px;padding:16px 18px 15px;transition:background .2s,border-color .2s,transform .2s}
.tile:hover{border-color:#7fe0b3;background:#1a3038;transform:translateY(-3px)}
.symbol{display:grid;place-items:center;width:34px;height:34px;background:#244338;color:#99edc4;border-radius:9px;font-size:1.25rem;margin-bottom:12px}
h2{font-size:1.25rem;letter-spacing:-.04em;margin:0 0 6px}
.tile p{color:#b5c6ca;font-size:.92rem;line-height:1.4;margin:0 0 12px}
.go{margin-top:auto;color:#a2ebc6;font-size:.88rem;font-weight:750}
footer{border-top:1px solid #30404a;color:#829ba3;font-size:.78rem;padding-top:21px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer a:hover{color:#a2ebc6}
@media(max-width:750px){main{padding:30px 0 36px}.grid{grid-template-columns:1fr}.tile{min-height:0;padding:23px}.symbol{margin-bottom:20px}.tile p{margin-bottom:22px}header span.note{display:none}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}

main{justify-content:flex-start}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:12px 0 24px}.switch{display:flex;border:1px solid #344955;border-radius:10px;padding:4px;gap:4px}button{font:inherit;color:#b5c6ca;background:transparent;border:0;border-radius:7px;padding:8px 18px;cursor:pointer}button[aria-pressed=true]{background:#244338;color:#a2ebc6}body[data-env=dev] button[aria-pressed=true]{background:#483b29;color:#ffd8a4}body[data-env=dev] .go{color:#ffd8a4}.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.8rem;color:#b5c6ca}.links a:hover{text-decoration:underline}.tile{transform:none!important}.tile h2 a:hover{text-decoration:underline}.tile .go{display:block;margin-top:auto}.tile .go:hover{text-decoration:underline}button:focus-visible{outline:2px solid #81e2b3}</style></head><body data-env="live"><div class="shell"><header><a class="brand" href="/"><span class="brand-mark">✦</span> Places I Went</a><a href="/">Home</a></header><main><h1>Transformorate<span style="color:#7fe0b3">.</span></h1><p class="intro">Project workspace</p><div class="toolbar"><div class="switch" role="group" aria-label="Environment"><button type="button" data-mode="live" aria-pressed="true">Live</button><button type="button" data-mode="dev" aria-pressed="false">Dev</button></div><span id="status" role="status">Live — stable releases</span></div><div class="grid"><article class="tile"><span class="symbol" aria-hidden="true">▦</span><h2>MESH</h2><p>Organisation chart and team structure</p><a class="go launch" href="/inspector/Mesh/" data-live="/inspector/Mesh/" data-dev="/inspector/Meshdev/">Open Live →</a><div class="links"><a href="/inspector/Mesh/">Live ↗</a><a href="/inspector/Meshdev/">Dev ↗</a></div></article><article class="tile"><span class="symbol" aria-hidden="true">↗</span><h2>Transformation planner</h2><p>Initiatives, roadmap and milestones</p><a class="go launch" href="/inspect/transfo/" data-live="/inspect/transfo/" data-dev="/inspect/transfodev/">Open Live →</a><div class="links"><a href="/inspect/transfo/">Live ↗</a><a href="/inspect/transfodev/">Dev ↗</a></div></article></div></main><footer><span>Transformorate · Project workspace</span><a href="/">Places I Went</a></footer></div><script>function select(mode){document.body.dataset.env=mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelectorAll('.launch').forEach(a=>{a.href=a.dataset[mode];a.textContent=mode==='dev'?'Open Dev →':'Open Live →'});document.getElementById('status').textContent=mode==='dev'?'Dev — experimental builds':'Live — stable releases';try{localStorage.setItem('transformorate-env',mode)}catch(e){}}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.mode)));try{select(localStorage.getItem('transformorate-env')==='dev'?'dev':'live')}catch(e){select('live')}</script></body></html>
